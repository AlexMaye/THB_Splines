[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thbsplines"
version = "0.2.0"
description = "Hierarchical B-spline tools for FEniCSx"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "numba",
]

[tool.setuptools.packages.find]
where = ["src"]